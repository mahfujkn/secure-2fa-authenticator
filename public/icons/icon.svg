<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Inner Key / Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#glowFilter)" />
  
  <!-- Outer Subtle Glass Rim -->
  <rect x="25" y="25" width="462" height="462" rx="111" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" fill="none" />
  <rect x="32" y="32" width="448" height="448" rx="104" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" fill="none" />

  <!-- Shield Shape Background -->
  <path d="M256 96L376 148V252C376 332 324 396 256 424C188 396 136 332 136 252V148L256 96Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.25" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner High-Contrast Shield Rim -->
  <path d="M256 126L348 166V246C348 312 308 366 256 390C204 366 164 312 164 246V166L256 126Z" 
        fill="rgba(15, 23, 42, 0.65)" 
        stroke="rgba(255, 255, 255, 0.35)" 
        stroke-width="4" 
        stroke-linejoin="round" />

  <!-- 2FA Authenticator Emblem: Lock Body + Keyhole + Dynamic Rings -->
  <!-- Lock Shackle -->
  <path d="M216 230V196C216 173.909 233.909 156 256 156C278.091 156 296 173.909 296 196V230" 
        stroke="url(#glowGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#innerGlow)" />

  <!-- Lock Body -->
  <rect x="196" y="224" width="120" height="96" rx="20" fill="url(#glowGrad)" filter="url(#innerGlow)" />

  <!-- 2FA Keyhole & Pulse Wave -->
  <circle cx="256" cy="262" r="14" fill="#0F172A" />
  <path d="M251 268L248 294H264L261 268H251Z" fill="#0F172A" />

  <!-- Dynamic Timer / 2FA Pulse Arcs (Left & Right) -->
  <path d="M182 252C182 211 215 178 256 178" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M330 252C330 293 297 326 256 326" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.9" />

  <!-- Bottom Mini Verification Shield Dot -->
  <circle cx="256" cy="356" r="8" fill="#38BDF8" />
</svg>
